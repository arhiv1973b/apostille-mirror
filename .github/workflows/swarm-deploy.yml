name: Swarm Deploy and Evidence Sync

on:
  push:
    branches:
      - feature/evidence-deploy
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-evidence-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify UDHR Core Integrity & Zero-Weight Manifests
        run: |
          echo "[+] Verifying integrity of zero-weight OCR index mapping..."
          if [ -d "🏛️_EVIDENCE/OCR_TEXT_LAYER/UDHR_INDEX_MAPPING" ]; then
            echo "[+] UDHR Index Mapping structure verified."
          else
            echo "[-] Warning: UDHR Index Mapping folder missing, creating baseline."
            mkdir -p "🏛️_EVIDENCE/OCR_TEXT_LAYER/UDHR_INDEX_MAPPING"
          fi

      - name: Deploy to GitHub Pages (Targeted & Safe)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          # force_orphan removed to prevent race conditions and cross-branch overwrites
          force_orphan: false
          commit_message: "auto(deploy): sync verified evidence matrix from feature/evidence-deploy [skip ci]"
