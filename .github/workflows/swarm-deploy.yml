name: Swarm Deploy and Evidence Sync

on:
  push:
    branches:
      - feature/evidence-deploy
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  deploy-evidence-matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Layer 1 — Python Dependencies (Actor Bridge)
      - name: Cache Python Dependencies (Actor Bridge)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-actor-pip-CASE-MACHERET-${{ hashFiles('requirements_unlocked.txt') }}
          restore-keys: |
            ${{ runner.os }}-actor-pip-CASE-MACHERET-

      # Layer 2 — UDHR Index Mapping
      - name: Cache UDHR Index Mapping (Jus Cogens Persistent)
        id: udhr-cache
        uses: actions/cache@v4
        with:
          path: 🏛️_EVIDENCE/OCR_TEXT_LAYER/UDHR_INDEX_MAPPING/
          key: ${{ runner.os }}-udhr-index-matrix-v1-${{ hashFiles('🏛️_EVIDENCE/OCR_TEXT_LAYER/UDHR_INDEX_MAPPING/**') }}
          restore-keys: |
            ${{ runner.os }}-udhr-index-matrix-v1-

      - name: Verify UDHR Cache Integrity (Structured Manifest)
        if: steps.udhr-cache.outputs.cache-hit == 'true'
        run: |
          set -euo pipefail
          MANIFEST="🏛️_EVIDENCE/OCR_TEXT_LAYER/UDHR_INDEX_MAPPING/_MANIFEST.json"
          
          if [ ! -f "$MANIFEST" ]; then
            echo "[-] Structured manifest missing — cannot verify integrity"
            exit 1
          fi
          
          ACTUAL_ROOT=$(python3 -c '
          import os, json, hashlib
          out_dir = "🏛️_EVIDENCE/OCR_TEXT_LAYER/UDHR_INDEX_MAPPING"
          manifest_path = os.path.join(out_dir, "_MANIFEST.json")
          with open(manifest_path, "r", encoding="utf-8") as f:
              m = json.load(f)
          
          hasher = hashlib.sha256()
          for fn in sorted(m["files"].keys()):
              fpath = os.path.join(out_dir, fn)
              if os.path.exists(fpath):
                  with open(fpath, "rb") as f:
                      content = f.read()
                  rel_path = fn.replace("\\", "/")
                  hasher.update(rel_path.encode("utf-8"))
                  hasher.update(b"\0")
                  hasher.update(hashlib.sha256(content).digest())
          print(hasher.hexdigest())
          ')
          
          EXPECTED_ROOT=$(python3 -c 'import json; print(json.load(open("🏛️_EVIDENCE/OCR_TEXT_LAYER/UDHR_INDEX_MAPPING/_MANIFEST.json"))["root"])')

          if [ "$ACTUAL_ROOT" != "$EXPECTED_ROOT" ]; then
            echo "[-] Integrity failure — root mismatch (possible cache poisoning or file tampering)"
            echo "Expected Root: $EXPECTED_ROOT"
            echo "Actual Root:   $ACTUAL_ROOT"
            exit 1
          fi
          echo "[+] UDHR Index Matrix integrity confirmed via structured root manifest"

      - name: Guard against banned paths
        run: |
          set -euo pipefail
          if find . \( -path '*/credentials.json' -o -path '*/.env' -o -name 'id_rsa' \) | grep -q .; then
            echo "[-] Banned path detected"
            exit 1
          fi

      - name: Verify UDHR Core Structure
        run: |
          set -euo pipefail
          if [ -d "🏛️_EVIDENCE/OCR_TEXT_LAYER/UDHR_INDEX_MAPPING" ]; then
            echo "[+] UDHR Index Mapping structure verified."
          else
            echo "[-] Error: UDHR Index Mapping folder missing."
            exit 1
          fi

      - name: Compute SHA256 of DAG Ledger
        id: ledger
        run: |
          set -euo pipefail
          if [ ! -f "DAG_SWARM_LEDGER.jsonl" ]; then
            echo "[-] Error: DAG_SWARM_LEDGER.jsonl not found"
            exit 1
          fi
          HASH=$(sha256sum DAG_SWARM_LEDGER.jsonl | awk '{print $1}')
          echo "ledger_sha256=$HASH" >> "$GITHUB_OUTPUT"
          echo "$HASH" > ledger_hash.txt
          echo "[+] Ledger hash: $HASH"

      - name: Upload Ledger Hash Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ledger-hash
          path: ledger_hash.txt
          if-no-files-found: error

      - name: Prepare evidence_site
        run: |
          set -euo pipefail
          mkdir -p evidence_site
          cp -r "🏛️_EVIDENCE" evidence_site/
          cp DAG_SWARM_LEDGER.jsonl evidence_site/
          cp ledger_hash.txt evidence_site/
          
          {
            echo "<html><body>"
            echo "<h1>Evidence Index — CASE-MACHERET-1997-2026</h1>"
            echo "<p>Ledger SHA256: $(cat ledger_hash.txt)</p>"
            echo "<ul>"
            find evidence_site -type f ! -name 'index.html' -printf '<li><a href="%P">%P</a></li>\n'
            echo "</ul></body></html>"
          } > evidence_site/index.html
          
          echo "[+] Prepared evidence_site:"
          find evidence_site -type f | head -30

      - name: Deploy to GitHub Pages (Targeted & Safe)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: evidence_site
          publish_branch: gh-pages
          force_orphan: false
          commit_message: "auto(deploy): sync verified evidence matrix [skip ci]"

      - name: Summary
        run: |
          {
            echo "### Evidence Deploy Summary"
            echo "- UDHR Index Mapping: verified"
            echo "- Cache hit (UDHR): ${{ steps.udhr-cache.outputs.cache-hit }}"
            echo "- DAG Ledger SHA256: \`${{ steps.ledger.outputs.ledger_sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
