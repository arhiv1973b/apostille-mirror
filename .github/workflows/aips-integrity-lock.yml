name: AIPS-2025 Integrity Lock
on: [push, pull_request]
jobs:
  forensic-lock:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          # Используем git grep для поиска, исключая папки с легитимным использованием токенов
          # Исключаем case_macheret_repo, mirrors и Forensic_Audit_20260524
          if git grep -lE "Ator|A_tor|Aotor|A\[©\]" -- . :!case_macheret_repo/* :!mirrors/* :!Forensic_Audit_20260524/* :!A©t0r_COPILOT_AUDIT_DIRECTIVE.md 2>/dev/null; then exit 1; fi
          for f in $(find . -type f \( -name '*.html' -o -name '*.json' -o -name '*.md' \)); do
            iconv -f UTF-8 -t UTF-8 "$f" >/dev/null || exit 1
          done
          mkdir -p .aips-manifests
          sha256sum $(find . -type f \( -name '*.html' -o -name '*.json' -o -name '*.md' \)) > .aips-manifests/latest.sha256
          git config user.name 'A©tor'
          git config user.email 'aips@aips-2025.local'
          git add .aips-manifests/
          git commit -m 'chore(aips): forensic lock updated' || true
          git push origin main