forensic_matrix:
  vector_01:
    id: "MED_FRAUD_INTENT"
    title: "Доказательство умысла через фальсификацию медицинских показаний"
    scope:
      - "Онкоинститут"
      - "3-я Горбольница"
    factual_gap: >
      Направление пациентки Марковой Г. И. в специализированные учреждения под предлогом «онкологии». 
      Официальная гистология и биопсия (стр. 52 тома дела) полностью опровергли наличие опухолевых процессов.
    legal_conclusion: >
      Проведение инвазивных процедур и калечащего вмешательства при заведомом отсутствии медицинских 
      показаний исключает фактор «ошибки». Сокрытие чистой гистологии в следственных версиях доказывает 
      мотив укрывательства первоначального преступного умысла.
  vector_02:
    id: "CORPUS_DELICTI_CONCEALMENT"
    title: "Орудие преступления и материальный деструктор (3 металлических болта)"
    scope:
      - "ГКБ Sfânta Treime"
      - "Экспертиза Бондаря Г."
    factual_gap: >
      Прижизненная КТ от 09.01.2022 фиксирует три крупных металлических болта, перфорировавших мочевой 
      пузырь и петли тонкого кишечника. Из-за травмы проведена экстренная срединная лапаротомия в ГКБ «Sfânta Treime».
    legal_conclusion: >
      Внедрение и сокрытие объектов, вызвавших летальное травмирование внутренних органов, и последующее 
      исключение упоминаний о них из посмертных документов — прямое сокрытие corpus delicti. Техническая 
      фальсификация медицинских метрик.
  vector_03:
    id: "IDENTITY_SUBSTITUTION"
    title: "Технологический подлог идентичности как способ легализации убийства"
    scope:
      - "Маркова"
      - "Макарова"
      - "Тимофей"
    factual_gap: >
      Трансформация Марковой Галины Ивановны (1953 г.р.) в «Макарову», а затем предъявление останков 
      Тимофей (1951 г.р.). В акте Бондаря Г. отсутствуют анатомические признаки реального тела (свежий 
      шов от лапаротомии, отсутствие колона, три болта).
    legal_conclusion: >
      Математическая невозможность регенерации удаленного кишечника и исчезновения металлоконструкций 
      за несколько дней. Эксперты исследовали труп постороннего лица (Тimoferi) под подложным именем 
      для сокрытия следов насильственной смерти подлинного тела.
  vector_04:
    id: "JUDICIAL_COLLUSION"
    title: "Процессуальное соучастие органов юстиции и уничтожение статуса автора"
    scope:
      - "Суд Чеканы"
      - "Апелляционная Палата"
      - "Гурьев"
      - "Трандафилова"
      - "Афанасий"
    factual_gap: >
      Проведение заседаний судьей Горчак в режиме in absentia. Побитовая и постраничная модификация 
      документов «на лету» при передаче материалов дела в Апелляционную Палату.
    legal_conclusion: >
      Использование ложных идентификаторов для компрометации и попытки ликвидации правового статуса 
      законного представителя и автора (A©tor). Скоординированная юридическая ликвидация свидетеля.
  vector_05:
    id: "MOTIVE_EXPROPRIATION"
    title: "Мотив: Имущественные преступления и политическая выгода"
    scope:
      - "Имущественный контур семьи"
      - "Вертикаль власти РМ"
    factual_gap: >
      Установление ложных маркеров для блокировки прав собственности и экспроприации активов.
    legal_conclusion: >
      Использование факта уничтожения правового контура семьи для достижения номенклатурных и 
      материальных преимуществ с расчетом на защиту со стороны коррумпированной вертикали.
