<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A©tor Forensic Evidence Vault</title>
    <style>
        :root {
            --primary: #00e5ff;
            --bg: #0a0a0c;
            --card: #151518;
            --text: #e0e0e0;
        }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        h1 { color: var(--primary); text-transform: uppercase; letter-spacing: 2px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--card);
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            transition: 0.3s;
        }
        .card:hover { border-color: var(--primary); box-shadow: 0 0 15px rgba(0, 229, 255, 0.2); }
        .hash { font-family: monospace; font-size: 0.8em; color: #888; word-break: break-all; margin: 10px 0; }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: #000;
            padding: 8px 15px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            margin-right: 10px;
        }
        .btn-donate {
            background: #ffea00;
        }
        .meta { font-size: 0.85em; color: #bbb; }
        .footer { margin-top: 50px; text-align: center; font-size: 0.8em; color: #555; }
    </style>
</head>
<body>
    <header>
        <h1>A©tor Forensic Evidence Vault</h1>
        <p>Криптографически гарантированные метаданные и доказательства (CASE-MACHERET-1997-2026)</p>
    </header>

    <div class="grid" id="evidence-grid">
        <!-- Улики будут загружены динамически через JS -->
    </div>

    <div class="footer">
        <p>© 1997-2026 Алексей Артурович Мачерет. Все права защищены. Jus Cogens & Erga Omnes.</p>
    </div>

    <script>
        const casIndex = {
            "F16B1BE182D334C8DF8EC793B8A3B73DC005CAD08EBB7E72847B56A872386DC2": {
                "node_id": "NODE-F16B1BE1",
                "doc_id": "DOSARUL21-30 (1).подписан.pdf",
                "status": "RECLAIMED_FROM_CANCELED",
                "timestamp": "2026-05-23T16:00:00Z",
                "links": {
                    "Primary": "https://github.com/arhiv1973b/apostille-mirror/raw/main/dist/blobs/F16B1BE182D334C8DF8EC793B8A3B73DC005CAD08EBB7E72847B56A872386DC2"
                }
            },
            "8574FF5F3394957565D04772E44A3A9C92CDC33C69B51862D617319D53865576": {
                "node_id": "NODE-8574FF5F",
                "doc_id": "DOSARUL21-30_1.pdf",
                "status": "RECLAIMED_FROM_CANCELED",
                "timestamp": "2026-05-23T16:00:00Z",
                "links": {
                    "Primary": "https://github.com/arhiv1973b/apostille-mirror/raw/main/dist/blobs/8574FF5F3394957565D04772E44A3A9C92CDC33C69B51862D617319D53865576"
                }
            }
        };

        const grid = document.getElementById('evidence-grid');
        for (const hash in casIndex) {
            const node = casIndex[hash];
            const card = document.createElement('div');
            card.className = 'card';
            // Вторые контекстные имена строго из метаданных (context_name)
            const displayName = node.context_name || node.doc_id.split('.')[0];
            
            card.innerHTML = `
                <div class="meta">ID: ${node.node_id} | TYPE: ${node.type_hint || 'DATA'}</div>
                <h3><a href="EVIDENCE_CATALOG.md#${hash.substring(0,8)}" style="text-decoration:none; color:inherit;">${displayName}</a></h3>
                <div class="hash">Hash-Link: <a href="${node.links.Primary}" target="_blank" style="color: var(--primary); font-weight:bold;">${hash}</a></div>
                <div class="meta">Фиксация: ${node.timestamp}</div>
                <br>
                <a href="${node.links.Primary}" class="btn" target="_blank">ИСТОЧНИК (Blob)</a>
                <a href="EVIDENCE_CATALOG.md#${hash.substring(0,8)}" class="btn" style="background:#333; color:#fff;">КОНТЕКСТ (MD)</a>
            `;
            grid.appendChild(card);
        }
    </script>
</body>
</html>
