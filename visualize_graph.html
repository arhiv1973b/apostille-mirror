<!DOCTYPE html>
<html>
<head>
    <title>Graph Visualization - CASE-MACHERET-1997-2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
    <style>
        #cy { width: 100%; height: 600px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Entity Graph Visualization</h1>
    <div id="cy"></div>
    <script>
        fetch('entity_graph.json')
            .then(response => response.json())
            .then(data => {
                var cy = cytoscape({
                    container: document.getElementById('cy'),
                    elements: {
                        nodes: data.nodes.map(n => ({ data: n })),
                        edges: data.edges.map(e => ({ data: e }))
                    },
                    style: [
                        { selector: 'node', style: { 'label': 'data(label)', 'background-color': '#0074D9' } },
                        { selector: 'edge', style: { 'curve-style': 'bezier', 'target-arrow-shape': 'triangle', 'label': 'data(relation)' } }
                    ]
                });
            });
    </script>
</body>
</html>
